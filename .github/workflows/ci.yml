name: CI

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - run: pnpm test --silent

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Cypress binary
        run: pnpm exec cypress install

      - name: Run Cypress
        run: pnpm test:cypress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Type check
        run: pnpm exec tsc

      - name: Build
        run: pnpm build

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Format
        run: pnpm fmt

      - name: Lint
        run: pnpm lint
